{{- include "service.pinGuard" . }}
# One identity per service. Istio AuthorizationPolicy (Phase 5) keys on this
# ServiceAccount's SPIFFE ID, never on IPs or labels.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
automountServiceAccountToken: false
